name: Content Player v2 — CI & Publish

on:
  push:
    tags:
      - '*'

defaults:
  run:
    working-directory: player-v2

jobs:
  # ── Functional tests: runs on push and pull_request ──────────────────────
  test:
    name: Lint, Test & Build
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.21.1'
          cache: 'npm'
          cache-dependency-path: player-v2/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Run tests
        run: npm run test:run

      - name: Build
        run: npm run build

  # ── Publish to npm: runs only on a player-v2-v* tag ──────────────────────
  publish-npm:
    name: Publish to npm
    needs: test
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.21.1'
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'
          cache-dependency-path: player-v2/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build package
        run: npm run build

      - name: Publish to npm
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
